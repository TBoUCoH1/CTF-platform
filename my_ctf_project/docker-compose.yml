version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ctf_database
    environment:
      POSTGRES_USER: ctf_user
      POSTGRES_PASSWORD: ctf_password
      POSTGRES_DB: ctf_db
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ctf_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctf_user -d ctf_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ctf-platform-backend:latest 
    container_name: ctf_backend
    environment:
      JWT_SECRET: "CHANGE_ME_IN_PROD_RANDOM_STRING"
      DB_USER: "ctf_user"
      DB_PASSWORD: "ctf_password"
      DB_HOST: "db"
      DB_PORT: "5432"
      DB_NAME: "ctf_db"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ctf_network

  web:
    image: ctf-platform-web:latest
    container_name: ctf_web
    ports:
      - "5000:5000"
    networks:
      - ctf_network

volumes:
  postgres_data:

networks:
  ctf_network:
    driver: bridge
